[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-spatial-input-eval-v0"
version = "0.1.0"
description = "Offline paired spatial-input evaluation over the existing Astra infer transport"
requires-python = ">=3.10"

[project.scripts]
astra-spatial-eval = "spatial_eval.cli:main"

[tool.setuptools.packages.find]
include = ["spatial_eval*"]
